# Generated project source of truth. Run `xcodegen generate` after editing
# this file; Dimit.xcodeproj itself is not committed (see .gitignore) so
# there is never a merge conflict in a generated pbxproj.
name: Dimit
options:
  bundleIdPrefix: app.dimit
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0" # Swift 6 toolchain, Swift 5 language mode — CLAUDE.md §2
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_IDENTITY: "-" # ad-hoc for dev builds. Never put a Developer ID here: scripts/build.sh injects it from DIMIT_SIGN_IDENTITY (docs/RELEASE.md §0)
  configs:
    # Xcode injects com.apple.security.get-task-allow (debugger attach) into
    # every build unless told not to. Debug keeps it — the debugger and the
    # test host need it — but a Release build must carry no entitlement at
    # all (CLAUDE.md §7), and notarytool rejects get-task-allow outright.
    # Set here, not only on scripts/build.sh's command line, so an Xcode
    # Product → Archive produces the same artifact (C6 review).
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  # CLAUDE.md §2 pre-approves this exact dependency for global hotkeys
  # ("sindresorhus/KeyboardShortcuts") — docs/PLAN.md's C4 scope names it
  # explicitly too, so this isn't a new ask, just the point where it's
  # actually wired in. Pinned to an exact version, same reasoning as any
  # dependency: reproducible builds, no surprise API changes.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.9.4
targets:
  Dimit:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Dimit
        excludes:
          - Info.plist # referenced via INFOPLIST_FILE below, not as a copied resource
    dependencies:
      - package: KeyboardShortcuts
    # No top-level `info:` key: that tells XcodeGen to *generate and own*
    # the plist (it silently overwrites a hand-written one with its own
    # minimal template on every `generate`, which cost a debugging round
    # trip). Pointing INFOPLIST_FILE at our own file instead means XcodeGen
    # never touches it and Xcode's build system just uses it as-is.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dimit.mac
        PRODUCT_NAME: Dimit
        MARKETING_VERSION: "0.4"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Dimit/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  DimitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: DimitTests
    dependencies:
      - target: Dimit
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dimit.app/Contents/MacOS/Dimit"
schemes:
  Dimit:
    build:
      targets:
        Dimit: all
        DimitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DimitTests
